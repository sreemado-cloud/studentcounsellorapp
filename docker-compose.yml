services:
  # MongoDB Database (C6: secrets from root .env via env.example)
  mongodb:
    image: mongo:7.0
    container_name: student-counsellor-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      # Use empty string if unset (for existing DB created with no password). Set in .env for new installs.
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-}
      MONGO_INITDB_DATABASE: student_counsellor
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - app-network
    # No healthcheck: backend uses service_started + connection retries to avoid "unhealthy" blocking the stack

  # Backend API
  # C6: Secrets only from backend/.env. Do not override SECRET_KEY or MONGODB_URL here.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student-counsellor-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017
      - DATABASE_NAME=student_counsellor
    # SECRET_KEY, ACCESS_TOKEN_* etc. come from .env only
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student-counsellor-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
