# Fluent Bit configuration for high-isolation mode (database-per-tenant)
# Routes logs to separate CloudWatch Log Groups per tenant
# REQUIRED when SAAS_ISOLATION_LEVEL=high or TENANT_STRATEGY=database_per_tenant

apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: student-counsellor
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/*backend*.log
        Parser            docker
        Tag               backend.*
        Refresh_Interval  5
        Skip_Long_Lines   On

    # Parse log to extract institution_id
    [FILTER]
        Name                parser
        Match               backend.*
        Key_Name            log
        Parser              tenant_parser
        Reserve_Data        On
        Preserve_Key        On

    # Route logs to tenant-specific log groups
    [FILTER]
        Name                rewrite_tag
        Match               backend.*
        Rule                $institution_id ^(inst_[a-zA-Z0-9_]+)$ tenant.$1 false
        Emitter_Name        re_emitted

    # Output to CloudWatch with dynamic log group per tenant
    [OUTPUT]
        Name                cloudwatch_logs
        Match               tenant.*
        region              ${AWS_REGION}
        log_group_name      /aws/eks/student-counsellor/tenant-${institution_id}
        log_stream_name     backend-${HOSTNAME}
        auto_create_group   true
        log_retention_days   30

  parsers.conf: |
    [PARSER]
        Name        tenant_parser
        Format      regex
        Regex       ^.*Tenant:\s*(?<institution_id>inst_[a-zA-Z0-9_]+).*$
        Time_Key    time
        Time_Format %Y-%m-%d %H:%M:%S
        Types       institution_id:string

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: student-counsellor
  labels:
    app: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      containers:
      - name: fluent-bit
        image: public.ecr.aws/aws-observability/aws-for-fluent-bit:stable
        imagePullPolicy: Always
        resources:
          limits:
            memory: 500Mi
            cpu: 500m
          requests:
            memory: 100Mi
            cpu: 100m
        volumeMounts:
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc/
        env:
        - name: AWS_REGION
          value: "us-east-1"  # Update to your region
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config
      tolerations:
      - operator: Exists
        effect: NoSchedule

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: student-counsellor
  annotations:
    eks.amazonaws.com/role-arn: ${FLUENT_BIT_IAM_ROLE_ARN}  # Set via Terraform or manually
