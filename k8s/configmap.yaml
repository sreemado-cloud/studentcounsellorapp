apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: student-counsellor
data:
  DATABASE_NAME: "student_counsellor"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  VITE_API_URL: "/api"
  # C5: Set explicit origins in production (no *). Comma-separated list.
  # Example: "https://app.example.com" or "https://app.example.com,https://admin.example.com"
  ALLOWED_ORIGINS: "https://your-frontend-domain.example.com"
  # Multi-tenancy strategy: row_level (default), collection_per_tenant, database_per_tenant
  TENANT_STRATEGY: "row_level"
  # Debug mode (set to false in production)
  DEBUG: "false"